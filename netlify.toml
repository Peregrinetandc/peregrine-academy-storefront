[build]
  publish = "public"
  functions = "netlify/functions"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/api/order/create"
  to = "/.netlify/functions/order-create"
  status = 200

[[redirects]]
  from = "/api/order/verify"
  to = "/.netlify/functions/order-verify"
  status = 200

[[redirects]]
  from = "/api/webhook/razorpay"
  to = "/.netlify/functions/webhook-razorpay"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
